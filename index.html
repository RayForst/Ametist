<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ametist - Markdown Editor</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --sidebar-bg: #f5f5f5;
            --border-color: #ddd;
            --hover-bg: #e0e0e0;
            --button-bg: #4a90e2;
            --button-hover: #357abd;
        }

        [data-theme="dark"] {
            --bg-color: #1e1e1e;
            --text-color: #ffffff;
            --sidebar-bg: #2d2d2d;
            --border-color: #404040;
            --hover-bg: #404040;
            --button-bg: #2b579a;
            --button-hover: #1e3f6f;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        #app {
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            height: 100vh;
        }

        #sidebar {
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        #sidebar-header {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        #current-directory {
            font-size: 14px;
            margin-bottom: 10px;
            word-break: break-all;
            color: var(--text-color);
            opacity: 0.8;
        }

        #file-explorer {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .directory-item {
            padding: 5px 0;
            cursor: pointer;
        }

        .directory-item:hover {
            background: var(--hover-bg);
        }

        .directory-item .name {
            display: flex;
            align-items: center;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .directory-item .name:hover {
            background: var(--hover-bg);
        }

        .directory-item .children {
            margin-left: 20px;
            display: none;
        }

        .directory-item.expanded .children {
            display: block;
        }

        .directory-item .icon {
            margin-right: 8px;
            width: 16px;
            height: 16px;
            display: inline-block;
        }

        .file-item {
            padding: 4px 8px;
            margin-left: 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 4px;
        }

        .file-item:hover {
            background: var(--hover-bg);
        }

        .file-item.active {
            background: var(--button-bg);
            color: white;
        }

        .delete-file {
            color: #ff4444;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            opacity: 0;
        }

        .file-item:hover .delete-file {
            opacity: 1;
        }

        .delete-file:hover {
            background: rgba(255, 68, 68, 0.1);
        }

        #editor-container {
            display: grid;
            grid-template-rows: 40px 1fr;
            height: 100vh;
        }

        #editor-toolbar {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        #editor-content {
            width: 100%;
            height: 100%;
            border: none;
            resize: none;
            font-size: 16px;
            line-height: 1.6;
            padding: 10px;
            box-sizing: border-box;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        #preview {
            padding: 20px;
            overflow-y: auto;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        #graph {
            background: var(--sidebar-bg);
            border-left: 1px solid var(--border-color);
        }

        #graph-container {
            width: 100%;
            height: 100%;
        }

        .button {
            background: var(--button-bg);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .button:hover {
            background: var(--button-hover);
        }

        .toggle-button {
            margin-left: auto;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }

        .toggle-button:hover {
            background: var(--hover-bg);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="sidebar">
            <div id="sidebar-header">
                <div id="current-directory">No directory selected</div>
                <button class="button" id="open-folder">Open Folder</button>
                <button class="button" id="new-file">New File</button>
            </div>
            <div id="file-explorer"></div>
        </div>
        <div id="editor-container">
            <div id="editor-toolbar">
                <button class="button" id="toggle-preview">Toggle Preview</button>
                <button class="button toggle-button" id="toggle-theme">Dark Mode</button>
            </div>
            <div id="editor-wrapper">
                <textarea id="editor-content" placeholder="Start writing your markdown here..."></textarea>
                <div id="preview" class="hidden"></div>
            </div>
        </div>
        <div id="graph">
            <div id="graph-container"></div>
        </div>
    </div>
    <script src="renderer.js"></script>
</body>
</html>
